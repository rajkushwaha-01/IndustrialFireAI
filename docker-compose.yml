version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: industrial_fire_postgis
    environment:
      POSTGRES_DB: industrial_fire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d industrial_fire_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
